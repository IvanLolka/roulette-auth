<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamSpin Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f0f13; color: #f3f4f6; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="bg-gray-900 border border-purple-900/40 rounded-2xl p-6 max-w-md w-full text-center shadow-2xl">
    <div class="mb-4">
      <h1 class="text-xl font-bold text-purple-400 mb-1">StreamSpin Auth</h1>
      <p id="status-text" class="text-sm text-gray-300">Инициализация авторизации...</p>
    </div>

    <!-- Fallback container if local server is unreachable -->
    <div id="fallback-ui" class="hidden space-y-3 mt-4 text-left">
      <p class="text-xs text-amber-400">Приложение StreamSpin не ответило на локальном порту. Скопируй токен вручную:</p>
      <input type="text" id="token-input" readonly onclick="this.select()" 
             class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs font-mono text-gray-200">
      <button onclick="copyToken()" class="w-full bg-purple-600 hover:bg-purple-700 text-xs font-semibold py-2 rounded-lg transition">
        Скопировать токен
      </button>
    </div>
  </div>

  <script>
    const CLIENT_ID = "dt57luvie92hosapsjvyqj1qtaeugg";
    const REDIRECT_URI = "https://ivanlolka.github.io/roulette-auth/";
    const SCOPES = "channel:read:redemptions";

    const statusEl = document.getElementById('status-text');
    const fallbackEl = document.getElementById('fallback-ui');

    // Parse params & hash
    const urlParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const token = hashParams.get('access_token');
    const port = urlParams.get('port') || '1421';

    if (token) {
      // Step 2: Token returned -> send immediately to local Rust server
      statusEl.textContent = "Передаём токен в StreamSpin...";

      fetch(`http://127.0.0.1:${port}/auth?access_token=${encodeURIComponent(token)}`, { mode: 'cors' })
        .then(res => res.json())
        .then(data => {
          if (data && data.status === 'ok') {
            statusEl.innerHTML = "<span class='text-emerald-400 font-semibold'>✨ Авторизация успешна!</span><br><span class='text-xs text-gray-400'>Приложение подключено. Вкладку можно закрыть.</span>";
          } else {
            showFallback(token);
          }
        })
        .catch(() => {
          showFallback(token);
        });
    } else {
      // Step 1: No token -> instant redirect to Twitch OAuth
      statusEl.textContent = "Перенаправляем на авторизацию Twitch...";
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${encodeURIComponent(CLIENT_ID)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    }

    function showFallback(token) {
      statusEl.textContent = "Токен получен!";
      fallbackEl.classList.remove('hidden');
      document.getElementById('token-input').value = token;
    }

    function copyToken() {
      const input = document.getElementById('token-input');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert('Токен скопирован!');
    }
  </script>
</body>
</html>
